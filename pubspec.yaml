name: cricketcoachflutter
description: "A Multi-Sport Coaching Platform mobile app."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  
  # Social Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^17.0.1

  # UI & Widgets
  flutter_svg: ^2.0.9
  table_calendar: ^3.0.9
  fl_chart: ^1.1.1
  image_picker: ^1.0.5
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  google_fonts: ^7.0.2

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Utilities
  intl: any
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.1
  flutter_animate: ^4.5.2
  ionicons: ^0.2.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  flutter_stripe: ^12.2.0
  flutter_rating_bar: ^4.0.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

dependency_overrides:
  intl: any
  http: ^1.2.0
