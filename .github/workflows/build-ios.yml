name: Build iOS IPA

on:
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab
  push:
    branches:
      - main
      - dev
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # Adjust to your Flutter version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (without signing)
        run: |
          flutter build ios --release --no-codesign
        
      - name: Create IPA archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r app-release.ipa Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricket-coaching-app-ios
          path: build/ios/iphoneos/app-release.ipa
          retention-days: 30

      - name: Upload build summary
        run: |
          echo "## iOS Build Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 **IPA File:** cricket-coaching-app-ios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This IPA is built without code signing and is for testing purposes only." >> $GITHUB_STEP_SUMMARY
          echo "To install on a physical device, you'll need to properly sign the app with your Apple Developer certificates." >> $GITHUB_STEP_SUMMARY
