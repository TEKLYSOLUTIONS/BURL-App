name: Deploy to TestFlight

on:
  push:
    branches:
      - main  # Adjust if you want to trigger on a different branch or tag
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build_ios:
    name: Build and Deploy iOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 1. Setup Environment
      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Verify files were decoded
          echo "Certificate size: $(wc -c < $CERTIFICATE_PATH) bytes"
          echo "Provisioning profile size: $(wc -c < $PP_PATH) bytes"
          if [ ! -s $CERTIFICATE_PATH ]; then echo "ERROR: Certificate file is empty - check IOS_DISTRIBUTION_CERTIFICATE secret"; exit 1; fi
          if [ ! -s $PP_PATH ]; then echo "ERROR: Provisioning profile is empty - check IOS_PROVISIONING_PROFILE secret"; exit 1; fi

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH || { echo "ERROR: Certificate import failed - check P12_PASSWORD secret"; exit 1; }
          security list-keychain -d user -s $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Verify certificate is visible to codesign
          echo "Available signing identities:"
          security find-identity -v -p codesigning

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 2. Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
      
      - name: Install Dependencies
        run: flutter pub get

      # 3. Build IPA
      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # 4. Verify IPA Existence
      - name: List Build Directory
        run: ls build/ios/ipa/

      # 5. Upload to TestFlight
      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          echo "$APPSTORE_API_PRIVATE_KEY" > /tmp/AuthKey.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/BURL.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --apiKeyPath /tmp/AuthKey.p8
          rm /tmp/AuthKey.p8

      # 6. Save IPA for manual download
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burl-App-IPA  # This is the name of the zip file you'll download
          path: build/ios/ipa/BURL.ipa
          retention-days: 7

